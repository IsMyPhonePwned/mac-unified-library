[package]
name = "mul-apollo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "APOLLO-NG pattern-of-life engine (modules, SQLite, Biome/SEGB)"
build = "build.rs"

[features]
default = ["sqlite", "biome", "parallel"]
sqlite = []
biome = []
parallel = ["mul-core/parallel"]

[dependencies]
mul-core = { workspace = true }
mul-io = { workspace = true }
mul-unifiedlog = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
hashbrown = { workspace = true }
smallvec = { workspace = true }
flate2 = { workspace = true }
chrono = { workspace = true }
once_cell = { workspace = true }
ahash = { workspace = true }
regex = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
# none — build.rs only uses std

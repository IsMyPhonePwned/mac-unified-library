[package]
name = "mul-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen bindings for mac-unified-library"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wasm"]
wasm = []
wasm-threads = []
sqlite = ["mac-unified-library/sqlite"]

[dependencies]
mac-unified-library = { path = "../mac-unified-library", default-features = false, features = ["wasm", "biome"] }
mul-core = { path = "../mul-core", default-features = false }
mul-correlate = { path = "../mul-correlate", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
getrandom = { workspace = true }

# Converted from legacy APOLLO module "aggregate_dictionary_distributed_keys.txt"

id = "aggregate_dictionary_distributed_keys"
name = "aggregate_dictionary_distributed_keys"
activity = "Aggregate Dictionary - Distributed Key"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Keeping track of various values on a per-day basis."
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["ADDataStore.sqlitedb"]
path_globs = ["**/ADDataStore.sqlitedb", "**/ADDataStore.sqlitedb-wal", "**/Archives/ADDataStore.sqlitedb.gz", "**/Archives/ADDataStore.sqlitedb"]

[timestamp]
column = "day"
epoch = "iso_text"

[[variant]]
label = "legacy-8_9_10_11_12_13_14"
sql = '''
SELECT
		DATE(DISTRIBUTIONKEYS.DAYSSINCE1970*86400, 'unixepoch') AS "DAY",
		DISTRIBUTIONKEYS.KEY AS "KEY",
		DISTRIBUTIONVALUES.VALUE AS "VALUE",
		DISTRIBUTIONVALUES.SECONDSINDAYOFFSET AS "SECONDS IN DAY OFFSET",
		DISTRIBUTIONVALUES.DISTRIBUTIONID AS "DISTRIBUTIONVALUES TABLE ID"
	FROM
		DISTRIBUTIONKEYS 
		LEFT JOIN
			DISTRIBUTIONVALUES 
			ON DISTRIBUTIONKEYS.ROWID = DISTRIBUTIONVALUES.DISTRIBUTIONID
'''
[variant.requires]
tables = []

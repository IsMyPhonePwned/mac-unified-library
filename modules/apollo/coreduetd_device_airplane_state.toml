# Converted from legacy APOLLO module "coreduetd_device_airplane_state.txt"

id = "coreduetd_device_airplane_state"
name = "coreduetd_device_airplane_state"
activity = "Airplane Mode"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Airplane Mode"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["coreduetd.db"]
path_globs = ["**/coreduetd.db", "**/coreduetd.db-wal", "**/Archives/coreduetd.db.gz", "**/Archives/coreduetd.db"]

[timestamp]
column = "create_time"
epoch = "iso_text"

[[variant]]
label = "legacy-8_9"
sql = '''
SELECT
		DATETIME(ZCREATIONDATE+978307200,"UNIXEPOCH") AS "CREATE TIME",
		TIME(ZLOCALTIME,"UNIXEPOCH") AS "LOCAL DEVICE TIME",
		TIME(ZCREATIONDATE-ZLOCALTIME,"UNIXEPOCH") AS "TIME ZONE",
		CASE ZAIRPLANEMODEON
		    WHEN "0" THEN "OFF"
		    WHEN "1" THEN "ON"
		END "AIRPLANE MODE"
	FROM ZCDDMAIRPLANEMODEEVENT
'''
[variant.requires]
tables = ["ZCDDMAIRPLANEMODEEVENT"]

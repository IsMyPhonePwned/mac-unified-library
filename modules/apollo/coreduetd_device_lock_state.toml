# Converted from legacy APOLLO module "coreduetd_device_lock_state.txt"

id = "coreduetd_device_lock_state"
name = "coreduetd_device_lock_state"
activity = "Lock State"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Lock State"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["coreduetd.db"]
path_globs = ["**/coreduetd.db", "**/coreduetd.db-wal", "**/Archives/coreduetd.db.gz", "**/Archives/coreduetd.db"]

[timestamp]
column = "create_time"
epoch = "iso_text"

[[variant]]
label = "legacy-8_9"
sql = '''
SELECT 
		DATETIME(ZCREATIONDATE+978307200,"UNIXEPOCH") AS "CREATE TIME",
		TIME(ZLOCALTIME,"UNIXEPOCH") AS "LOCAL DEVICE TIME",
		TIME(ZCREATIONDATE-ZLOCALTIME,"UNIXEPOCH") AS "TIME ZONE",
		CASE ZLOCKSTATE
		    WHEN "0" THEN "UNLOCKED"
		    WHEN "1" THEN "LOCKED"
		END "LOCK STATE"
	FROM ZCDDMSCREENLOCKEVENT
'''
[variant.requires]
tables = ["ZCDDMSCREENLOCKEVENT"]

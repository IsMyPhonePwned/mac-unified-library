# Converted from legacy APOLLO module "datausage_zliveusage.txt"

id = "datausage_zliveusage"
name = "datausage_zliveusage"
activity = "Data Usage"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Data Usage Traffic by Process."
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["DataUsage.sqlite,DataUsage-watch.sqlite"]
path_globs = ["**/DataUsage.sqlite,DataUsage-watch.sqlite", "**/DataUsage.sqlite,DataUsage-watch.sqlite-wal", "**/Archives/DataUsage.sqlite,DataUsage-watch.sqlite.gz", "**/Archives/DataUsage.sqlite,DataUsage-watch.sqlite"]

[timestamp]
column = "timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-8_9_10_11_12_13_14"
sql = '''
SELECT
		DATETIME(ZLIVEUSAGE.ZTIMESTAMP + 978307200, 'UNIXEPOCH') AS "TIMESTAMP",
		DATETIME(ZPROCESS.ZFIRSTTIMESTAMP + 978307200, 'UNIXEPOCH') AS "PROCESS FIRST TIMESTAMP",
		DATETIME(ZPROCESS.ZTIMESTAMP+ 978307200, 'UNIXEPOCH') AS "PROCESS TIMESTAMP",
		ZPROCESS.ZPROCNAME AS "PROCESS NAME",
		ZPROCESS.ZBUNDLENAME AS "BUNDLE ID",
		ZLIVEUSAGE.ZWIFIIN AS "WIFI IN",
		ZLIVEUSAGE.ZWIFIOUT AS "WIFI OUT",
		ZLIVEUSAGE.ZWWANIN AS "WWAN IN",
		ZLIVEUSAGE.ZWWANOUT AS "WWAN OUT",
		ZLIVEUSAGE.Z_PK AS "ZLIVEUSAGE TABLE ID" 
	FROM ZLIVEUSAGE
	LEFT JOIN ZPROCESS ON ZLIVEUSAGE.ZHASPROCESS = ZPROCESS.Z_PK
'''
[variant.requires]
tables = ["ZLIVEUSAGE", "ZPROCESS"]

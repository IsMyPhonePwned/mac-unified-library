# Converted from legacy APOLLO module "health_ecg_average_heart_rate.txt"

id = "health_ecg_average_heart_rate"
name = "health_ecg_average_heart_rate"
activity = "ECG Average Heart Rate"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Electrocardiogram (ECG) Average Heart Rate"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["healthdb_secure.sqlite"]
path_globs = ["**/healthdb_secure.sqlite", "**/healthdb_secure.sqlite-wal", "**/Archives/healthdb_secure.sqlite.gz", "**/Archives/healthdb_secure.sqlite"]

[timestamp]
column = "start_date"
epoch = "iso_text"

[[variant]]
label = "legacy-12_13_14"
sql = '''
SELECT
		DATETIME(SAMPLES.START_DATE + 978307200, 'UNIXEPOCH') AS "START DATE",
		DATETIME(SAMPLES.END_DATE + 978307200, 'UNIXEPOCH') AS "END DATE",
		METADATA_VALUES.NUMERICAL_VALUE AS "ECG AVERAGE HEARTRATE",
		(SAMPLES.END_DATE-SAMPLES.START_DATE) AS "TIME IN SECONDS"
	FROM
	    SAMPLES 
	    LEFT OUTER JOIN
	        METADATA_VALUES 
	        ON METADATA_VALUES.OBJECT_ID = SAMPLES.DATA_ID 
	    LEFT OUTER JOIN
	        METADATA_KEYS 
	        ON METADATA_KEYS.ROWID = METADATA_VALUES.KEY_ID 
	    LEFT OUTER JOIN
	        WORKOUTS 
	        ON WORKOUTS.DATA_ID = SAMPLES.DATA_ID 
	WHERE
	    KEY IS "_HKPrivateMetadataKeyElectrocardiogramHeartRate"
'''
[variant.requires]
tables = []

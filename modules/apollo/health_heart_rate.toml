# Converted from legacy APOLLO module "health_heart_rate.txt"

id = "health_heart_rate"
name = "health_heart_rate"
activity = "Health Heart Rate"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Health Heart Rate"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["healthdb_secure.sqlite"]
path_globs = ["**/healthdb_secure.sqlite", "**/healthdb_secure.sqlite-wal", "**/Archives/healthdb_secure.sqlite.gz", "**/Archives/healthdb_secure.sqlite"]

[timestamp]
column = "date"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_14"
sql = '''
SELECT
		DATETIME(SAMPLES.START_DATE + 978307200, 'UNIXEPOCH') AS "DATE",
		ORIGINAL_QUANTITY AS "HEART RATE", 
		UNIT_STRINGS.UNIT_STRING AS "UNITS",
		QUANTITY AS "QUANTITY",
		SAMPLES.DATA_ID AS "SAMPLES TABLE ID" 
	FROM
	   SAMPLES 
	   LEFT OUTER JOIN
	      QUANTITY_SAMPLES 
	      ON SAMPLES.DATA_ID = QUANTITY_SAMPLES.DATA_ID 
	   LEFT OUTER JOIN
	      UNIT_STRINGS 
	      ON QUANTITY_SAMPLES.ORIGINAL_UNIT = UNIT_STRINGS.ROWID 
	WHERE
	   SAMPLES.DATA_TYPE = 5
'''
[variant.requires]
tables = []

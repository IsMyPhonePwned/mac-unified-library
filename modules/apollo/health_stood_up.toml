# Converted from legacy APOLLO module "health_stood_up.txt"

id = "health_stood_up"
name = "health_stood_up"
activity = "Health Stood Up"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Health Stood Up"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["healthdb_secure.sqlite"]
path_globs = ["**/healthdb_secure.sqlite", "**/healthdb_secure.sqlite-wal", "**/Archives/healthdb_secure.sqlite.gz", "**/Archives/healthdb_secure.sqlite"]

[timestamp]
column = "start_date"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_14"
sql = '''
SELECT
		DATETIME(SAMPLES.START_DATE + 978307200, 'UNIXEPOCH') AS "START DATE",
		DATETIME(SAMPLES.END_DATE + 978307200, 'UNIXEPOCH') AS "END DATE",
		QUANTITY AS "STOOD UP",
		(SAMPLES.END_DATE-SAMPLES.START_DATE) AS "TIME IN SECONDS",
		SAMPLES.DATA_ID AS "SAMPLES TABLE ID" 
	FROM
	   SAMPLES 
	   LEFT OUTER JOIN
	      QUANTITY_SAMPLES 
	      ON SAMPLES.DATA_ID = QUANTITY_SAMPLES.DATA_ID 
	WHERE
	   SAMPLES.DATA_TYPE = 75
'''
[variant.requires]
tables = []

# Converted from legacy APOLLO module "knowledge_inferred_microlocation_visit.txt"

id = "knowledge_inferred_microlocation_visit"
name = "knowledge_inferred_microlocation_visit"
activity = "Inferred microLocation Visit"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Inferred microLocation Visit"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["knowledgeC.db"]
path_globs = ["**/knowledgeC.db", "**/knowledgeC.db-wal", "**/Archives/knowledgeC.db.gz", "**/Archives/knowledgeC.db"]

[timestamp]
column = "start"
epoch = "iso_text"

[[variant]]
label = "legacy-13_14"
sql = '''
SELECT
      DATETIME(ZOBJECT.ZSTARTDATE+978307200,'UNIXEPOCH') AS "START", 
      DATETIME(ZOBJECT.ZENDDATE+978307200,'UNIXEPOCH') AS "END",
     ZOBJECT.ZVALUESTRING AS "STRING",
     ZSTRUCTUREDMETADATA.Z_DKMICROLOCATIONMETADATAKEY__DOMAIN AS "DOMAIN",
     HEX(ZSTRUCTUREDMETADATA.Z_DKMICROLOCATIONMETADATAKEY__PROBABILITYVECTOR) AS "PROBABILITY VECTOR (HEX)",
     ZSTRUCTUREDMETADATA.Z_DKMICROLOCATIONMETADATAKEY__LOCATIONDISTRIBUTION AS "LOCATION DISTRIBUTION",
     ZSTRUCTUREDMETADATA.Z_DKMICROLOCATIONMETADATAKEY__MICROLOCATIONDISTRIBUTION AS "MICROLOCATION DISTRIBUTION",
      CASE ZOBJECT.ZSTARTDAYOFWEEK 
         WHEN "1" THEN "Sunday"
         WHEN "2" THEN "Monday"
         WHEN "3" THEN "Tuesday"
         WHEN "4" THEN "Wednesday"
         WHEN "5" THEN "Thursday"
         WHEN "6" THEN "Friday"
         WHEN "7" THEN "Saturday"
      END "DAY OF WEEK",
      ZOBJECT.ZSECONDSFROMGMT/3600 AS "GMT OFFSET",
      DATETIME(ZOBJECT.ZCREATIONDATE+978307200,'UNIXEPOCH') AS "ENTRY CREATION",
      ZOBJECT.ZUUID AS "UUID", 
      ZSTRUCTUREDMETADATA.ZMETADATAHASH,
      ZOBJECT.Z_PK AS "ZOBJECT TABLE ID"
   FROM ZOBJECT
         LEFT JOIN
         ZSTRUCTUREDMETADATA 
         ON ZOBJECT.ZSTRUCTUREDMETADATA = ZSTRUCTUREDMETADATA.Z_PK 
      LEFT JOIN
         ZSOURCE 
         ON ZOBJECT.ZSOURCE = ZSOURCE.Z_PK 
   WHERE
      ZSTREAMNAME = "/inferred/microLocationVisit"
'''
[variant.requires]
tables = ["ZOBJECT"]

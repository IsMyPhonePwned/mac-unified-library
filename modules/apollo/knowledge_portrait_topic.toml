id = "knowledge_portrait_topic"
name = "knowledge_portrait_topic"
activity = "Portrait Topic"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Portrait Topic"
platforms = ["ios", "macos"]

[source]
kind = "sqlite"
db_names = ["knowledgeC.db"]
path_globs = ["**/knowledgeC.db", "**/knowledgeC.db-wal", "**/Archives/knowledgeC.db.gz", "**/Archives/knowledgeC.db"]

[timestamp]
column = "start"
epoch = "iso_text"

[[variant]]
label = "legacy-10.16_14"
sql = '''
SELECT
      DATETIME(ZOBJECT.ZSTARTDATE+978307200,'UNIXEPOCH') AS "START", 
      DATETIME(ZOBJECT.ZENDDATE+978307200,'UNIXEPOCH') AS "END",
      ZSTRUCTUREDMETADATA.Z_CDENTITYMETADATAKEY__NAME AS "NAME",
      ZSOURCE.ZBUNDLEID AS "SOURCE BUNDLE ID",
      ZSTRUCTUREDMETADATA.Z_CDPORTRAITMETADATAKEY__OSBUILD AS "OS BUILD",
      ZSOURCE.ZDEVICEID AS "DEVICE ID (HARDWARE UUID)",
      ZSOURCE.ZGROUPID AS "GROUP ID", 
      ZSOURCE.ZITEMID AS "ITEM ID",   
      ZSOURCE.ZSOURCEID AS "SOURCE ID",
      ZSTRUCTUREDMETADATA.Z_CDPORTRAITMETADATAKEY__ASSETVERSION AS "ASSET VERSION",
     ZSTRUCTUREDMETADATA.Z_CDPORTRAITMETADATAKEY__ALGORITHM  AS "ALGORITHM",
      ZSTRUCTUREDMETADATA.Z_CDENTITYMETADATAKEY__BESTLANGUAGE AS "BEST LANGUAGE",
     ZSTRUCTUREDMETADATA.Z_CDPORTRAITMETADATAKEY__DECAYRATE AS "DECAY RATE",
     ZSTRUCTUREDMETADATA.Z_CDPORTRAITMETADATAKEY__SCORE AS "SCORE",
     ZCUSTOMMETADATA.ZNAME AS "NAME",
     ZCUSTOMMETADATA.ZSTRINGVALUE AS "STRING",
     ZCUSTOMMETADATA.ZINTEGERVALUE AS "VALUE",
      ZOBJECT.ZVALUEINTEGER AS "VALUE", 
      CASE ZOBJECT.ZSTARTDAYOFWEEK 
         WHEN "1" THEN "Sunday"
         WHEN "2" THEN "Monday"
         WHEN "3" THEN "Tuesday"
         WHEN "4" THEN "Wednesday"
         WHEN "5" THEN "Thursday"
         WHEN "6" THEN "Friday"
         WHEN "7" THEN "Saturday"
      END "DAY OF WEEK",
      ZOBJECT.ZSECONDSFROMGMT/3600 AS "GMT OFFSET",
      DATETIME(ZOBJECT.ZCREATIONDATE+978307200,'UNIXEPOCH') AS "ENTRY CREATION",
      ZOBJECT.ZUUID AS "UUID", 
      ZSTRUCTUREDMETADATA.ZMETADATAHASH,
      ZOBJECT.Z_PK AS "ZOBJECT TABLE ID"
   FROM ZOBJECT
         LEFT JOIN
         ZSTRUCTUREDMETADATA 
         ON ZOBJECT.ZSTRUCTUREDMETADATA = ZSTRUCTUREDMETADATA.Z_PK 
      LEFT JOIN
         ZSOURCE 
         ON ZOBJECT.ZSOURCE = ZSOURCE.Z_PK 
       LEFT JOIN Z_4EVENT
      ON ZOBJECT.Z_PK = Z_4EVENT.Z_11EVENT
    LEFT JOIN ZCUSTOMMETADATA
      ON Z_4EVENT.Z_4CUSTOMMETADATA = ZCUSTOMMETADATA.Z_PK
   WHERE
      ZSTREAMNAME = "/portrait/topic"
'''
[variant.requires]
tables = ["ZOBJECT", "Z_4EVENT", "ZCUSTOMMETADATA"]


# Converted from legacy APOLLO module "knowledge_sharesheet_feedback.txt"

id = "knowledge_sharesheet_feedback"
name = "knowledge_sharesheet_feedback"
activity = "Sharesheet Feedback"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Sharesheet Feedback"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["knowledgeC.db"]
path_globs = ["**/knowledgeC.db", "**/knowledgeC.db-wal", "**/Archives/knowledgeC.db.gz", "**/Archives/knowledgeC.db"]

[timestamp]
column = "start"
epoch = "iso_text"

[[variant]]
label = "legacy-13_14"
sql = '''
SELECT
      DATETIME(ZOBJECT.ZSTARTDATE+978307200,'UNIXEPOCH') AS "START", 
      DATETIME(ZOBJECT.ZENDDATE+978307200,'UNIXEPOCH') AS "END",
      (ZOBJECT.ZENDDATE - ZOBJECT.ZSTARTDATE) AS "USAGE IN SECONDS",
      (ZOBJECT.ZENDDATE - ZOBJECT.ZSTARTDATE)/60.00 AS "USAGE IN MINUTES",
     ZSOURCE.ZBUNDLEID AS "BUNDLE ID",
     ZSOURCE.ZSOURCEID AS "SOURCE ID",
     ZSTRUCTUREDMETADATA.Z_DKSHARESHEETSUGGESTIONMETADATAKEY__TARGETBUNDLEID AS "TARGET BUNDLE ID",
     ZSTRUCTUREDMETADATA.Z_DKSHARESHEETSUGGESTIONMETADATAKEY__SOURCEBUNDLEID AS "SOURCE BUNDLE ID",
     ZSTRUCTUREDMETADATA.Z_DKSHARESHEETSUGGESTIONMETADATAKEY__DERIVEDINTENTIDENTIFIER AS "DERIVED INTENT ID",
     ZSTRUCTUREDMETADATA.Z_DKSHARESHEETSUGGESTIONMETADATAKEY__EXTENSIONCONTEXTUUID AS "EXTENSION CONTEXT UUID",
   ZCUSTOMMETADATA.ZNAME AS "NAME",
   HEX(ZCUSTOMMETADATA.ZBINARYVALUE) AS "VALUE(HEX)",
      CASE ZOBJECT.ZSTARTDAYOFWEEK 
         WHEN "1" THEN "Sunday"
         WHEN "2" THEN "Monday"
         WHEN "3" THEN "Tuesday"
         WHEN "4" THEN "Wednesday"
         WHEN "5" THEN "Thursday"
         WHEN "6" THEN "Friday"
         WHEN "7" THEN "Saturday"
      END "DAY OF WEEK",
      ZOBJECT.ZSECONDSFROMGMT/3600 AS "GMT OFFSET",
      DATETIME(ZOBJECT.ZCREATIONDATE+978307200,'UNIXEPOCH') AS "ENTRY CREATION",
      ZOBJECT.ZUUID AS "UUID", 
      ZSTRUCTUREDMETADATA.ZMETADATAHASH,
      ZOBJECT.Z_PK AS "ZOBJECT TABLE ID"
   FROM ZOBJECT
         LEFT JOIN
         ZSTRUCTUREDMETADATA 
         ON ZOBJECT.ZSTRUCTUREDMETADATA = ZSTRUCTUREDMETADATA.Z_PK 
      LEFT JOIN
         ZSOURCE 
         ON ZOBJECT.ZSOURCE = ZSOURCE.Z_PK 
   LEFT JOIN Z_4EVENT
    ON ZOBJECT.Z_PK = Z_4EVENT.Z_11EVENT
   LEFT JOIN ZCUSTOMMETADATA
    ON Z_4EVENT.Z_4CUSTOMMETADATA = ZCUSTOMMETADATA.Z_PK
   WHERE
      ZSTREAMNAME = "/sharesheet/feedback"
'''
[variant.requires]
tables = ["ZOBJECT", "Z_4EVENT", "ZCUSTOMMETADATA"]

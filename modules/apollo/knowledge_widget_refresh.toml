# Converted from legacy APOLLO module "knowledge_widget_refresh.txt"

id = "knowledge_widget_refresh"
name = "knowledge_widget_refresh"
activity = "Widget Refresh"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Widget Refresh"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["knowledgeC.db"]
path_globs = ["**/knowledgeC.db", "**/knowledgeC.db-wal", "**/Archives/knowledgeC.db.gz", "**/Archives/knowledgeC.db"]

[timestamp]
column = "start"
epoch = "iso_text"

[[variant]]
label = "legacy-14"
sql = '''
SELECT
      DATETIME(ZOBJECT.ZSTARTDATE+978307200,'UNIXEPOCH') AS "START", 
      ZOBJECT.ZVALUESTRING AS "BUNDLE ID", 
     ZCUSTOMMETADATA.ZNAME AS "NAME",
      CASE ZOBJECT.ZSTARTDAYOFWEEK 
         WHEN "1" THEN "Sunday"
         WHEN "2" THEN "Monday"
         WHEN "3" THEN "Tuesday"
         WHEN "4" THEN "Wednesday"
         WHEN "5" THEN "Thursday"
         WHEN "6" THEN "Friday"
         WHEN "7" THEN "Saturday"
      END "DAY OF WEEK",
      ZOBJECT.ZSECONDSFROMGMT/3600 AS "GMT OFFSET",
      DATETIME(ZOBJECT.ZCREATIONDATE+978307200,'UNIXEPOCH') AS "ENTRY CREATION", 
      ZOBJECT.ZUUID AS "UUID",
      ZOBJECT.Z_PK AS "ZOBJECT TABLE ID" 
   FROM ZOBJECT
         LEFT JOIN
         ZSTRUCTUREDMETADATA 
         ON ZOBJECT.ZSTRUCTUREDMETADATA = ZSTRUCTUREDMETADATA.Z_PK 
      LEFT JOIN
         ZSOURCE 
         ON ZOBJECT.ZSOURCE = ZSOURCE.Z_PK 
    LEFT JOIN Z_4EVENT
      ON ZOBJECT.Z_PK = Z_4EVENT.Z_11EVENT
    LEFT JOIN ZCUSTOMMETADATA
      ON Z_4EVENT.Z_4CUSTOMMETADATA = ZCUSTOMMETADATA.Z_PK
   WHERE
      ZSTREAMNAME = "/dasd/widgetRefresh"
'''
[variant.requires]
tables = ["ZOBJECT", "Z_4EVENT", "ZCUSTOMMETADATA"]

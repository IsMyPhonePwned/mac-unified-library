# Converted from legacy APOLLO module "locationd_cacheencryptedAB_poiharvestlocation.txt"

id = "locationd_cacheencryptedAB_poiharvestlocation"
name = "locationd_cacheencryptedAB_poiharvestlocation"
activity = "POI Location Harvest"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Locationd POI Harvest Location"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["cache_encryptedB.db"]
path_globs = ["**/cache_encryptedB.db", "**/cache_encryptedB.db-wal", "**/Archives/cache_encryptedB.db.gz", "**/Archives/cache_encryptedB.db"]

[timestamp]
column = "timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-10"
sql = '''
SELECT
		DATETIME(TIMESTAMP + 978307200,'UNIXEPOCH') AS "TIMESTAMP", 
		LATITUDE || ", " || LONGITUDE AS "COORDINATES",
		TRIGGERUUID AS "TRIGGERUUID",
		MOTIONACTIVITYTYPE AS  "MOTION ACTIVITY TYPE",
		BUNDLEIDS AS "BUNDLE IDS",
		CONFIDENCE AS "CONFIDENCE",
		ALTITUDE AS "ALTITUDE",
		HORIZONTALACCURACY AS "HORIZONTAL ACCURACY",
		VERTICALACCURACY AS "VERTICAL ACCURACY",
		LATITUDE AS "LATITUDE",
		LONGITUDE AS "LONGITUDE"
	FROM POIHARVESTLOCATION
'''
[variant.requires]
tables = ["POIHARVESTLOCATION"]

id = "locationd_cacheencryptedC_nataliehistory"
name = "locationd_cacheencryptedC_nataliehistory"
activity = "Health - Natalies"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Locationd Natalie History"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["cache_encryptedC.db"]
path_globs = ["**/cache_encryptedC.db", "**/cache_encryptedC.db-wal", "**/Archives/cache_encryptedC.db.gz", "**/Archives/cache_encryptedC.db"]

[timestamp]
column = "start_time"
epoch = "iso_text"

[[variant]]
label = "legacy-11_12_13_14"
sql = '''
SELECT 
		DATETIME(STARTTIME + 978307200, 'UNIXEPOCH') AS "START TIME",
		ACTIVITYTYPE AS "ACTIVITY TYPE",
		ISSTANDING AS "IS STANDING",
		METS AS "METS",
		NATALIES AS "NATALIES",
		BASALNATALIES AS "BASEL NATALIES",
		OVERRIDESET AS "OVERRIDE SET",
		TRUTHMETS AS "TRUTH METS",
		NATALIEHISTORY.ID AS "NATALIEHISTORY TABLE ID"
	FROM NATALIEHISTORY
'''
[variant.requires]
tables = ["NATALIEHISTORY"]


# Converted from legacy APOLLO module "netusage_zliveusage.txt"

id = "netusage_zliveusage"
name = "netusage_zliveusage"
activity = "Network Usage"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Network Usage Traffic by Process."
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["netusage.sqlite"]
path_globs = ["**/netusage.sqlite", "**/netusage.sqlite-wal", "**/Archives/netusage.sqlite.gz", "**/Archives/netusage.sqlite"]

[timestamp]
column = "process_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-10_11_12_13_10.13_10.14_10.15_10.16_14"
sql = '''
SELECT
        DATETIME(ZPROCESS.ZTIMESTAMP + 978307200, 'unixepoch') AS "PROCESS TIMESTAMP",
        DATETIME(ZPROCESS.ZFIRSTTIMESTAMP + 978307200, 'unixepoch') AS "PROCESS FIRST TIMESTAMP",
        DATETIME(ZLIVEUSAGE.ZTIMESTAMP + 978307200, 'unixepoch') AS "LIVE USAGE TIMESTAMP",
        ZBUNDLENAME AS "BUNDLE ID",
        ZPROCNAME AS "PROCESS NAME",
        ZWIFIIN AS "WIFI IN",
        ZWIFIOUT AS "WIFI OUT",
        ZWWANIN AS "WWAN IN",
        ZWWANOUT AS "WWAN OUT",
        ZWIREDIN AS "WIRED IN",
        ZWIREDOUT AS "WIRED OUT",
        ZXIN AS "X IN",
        ZXOUT AS "X OUT",
        ZLIVEUSAGE.Z_PK AS "ZLIVEUSAGE TABLE ID" 
    FROM ZLIVEUSAGE 
    LEFT JOIN ZPROCESS ON ZPROCESS.Z_PK = ZLIVEUSAGE.ZHASPROCESS
'''
[variant.requires]
tables = ["ZLIVEUSAGE", "ZPROCESS"]

[[variant]]
label = "legacy-8_9"
sql = '''
SELECT
        DATETIME(ZPROCESS.ZTIMESTAMP + 978307200, 'unixepoch') AS "PROCESS TIMESTAMP",
        DATETIME(ZPROCESS.ZFIRSTTIMESTAMP + 978307200, 'unixepoch') AS "PROCESS FIRST TIMESTAMP",
        DATETIME(ZLIVEUSAGE.ZTIMESTAMP + 978307200, 'unixepoch') AS "LIVE USAGE TIMESTAMP",
        ZBUNDLENAME AS "BUNDLE ID",
        ZPROCNAME AS "PROCESS NAME",
        ZWIFIIN AS "WIFI IN",
        ZWIFIOUT AS "WIFI OUT",
        ZWWANIN AS "WWAN IN",
        ZWWANOUT AS "WWAN OUT",
        ZWIREDIN AS "WIRED IN",
        ZWIREDOUT AS "WIRED OUT",
        ZLIVEUSAGE.Z_PK AS "ZLIVEUSAGE TABLE ID" 
    FROM ZLIVEUSAGE 
    LEFT JOIN ZPROCESS ON ZPROCESS.Z_PK = ZLIVEUSAGE.ZHASPROCESS
'''
[variant.requires]
tables = ["ZLIVEUSAGE", "ZPROCESS"]

# Converted from legacy APOLLO module "powerlog_activity_states.txt"

id = "powerlog_activity_states"
name = "powerlog_activity_states"
activity = "Activity States"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Activity States"
platforms = ["macos"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-10.13_10.14_10.15_10.16_13_14"
sql = '''
SELECT
		DATETIME(TIMESTAMP + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		ACTIVITYID AS 'ACTIVITY ID',
		STATE AS 'STATE',
		DATETIME(TIMESTAMP, 'UNIXEPOCH') AS ORIGINAL_TIMESTAMP,
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		SYSTEM AS TIME_OFFSET,
		TABLE_ID AS "PLSTORAGEOPERATOR_EVENTFORWARD_ACTIVITYSTATES TABLE ID"
	FROM
	(
	SELECT
		TABLE_ID,
		TIMESTAMP,
		TIME_OFFSET_TIMESTAMP,
		MAX(TIME_OFFSET_ID) AS MAX_ID,
		ACTIVITYID,
		STATE,
		SYSTEM
	FROM
	(
	SELECT
		PLSTORAGEOPERATOR_EVENTFORWARD_ACTIVITYSTATES.TIMESTAMP,
		PLSTORAGEOPERATOR_EVENTFORWARD_ACTIVITYSTATES.ACTIVITYID,
		PLSTORAGEOPERATOR_EVENTFORWARD_ACTIVITYSTATES.STATE,
		PLSTORAGEOPERATOR_EVENTFORWARD_ACTIVITYSTATES.ID AS "TABLE_ID",
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.ID AS TIME_OFFSET_ID,
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.SYSTEM
	FROM
		PLSTORAGEOPERATOR_EVENTFORWARD_ACTIVITYSTATES 
	LEFT JOIN
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET 
	)
	GROUP BY
	TABLE_ID 
         )
'''
[variant.requires]
tables = []

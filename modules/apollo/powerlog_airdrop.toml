# Converted from legacy APOLLO module "powerlog_airdrop.txt"

id = "powerlog_airdrop"
name = "powerlog_airdrop"
activity = "Airdrop Connection"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Airdrop Connection infomation"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_14"
sql = '''
SELECT
		DATETIME(AIRDROP_TIMESTAMP + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		STATE,
		SUBEVENT,
		BUNDLEID AS BUNDLE_ID,
		PID,
		DATETIME(AIRDROP_TIMESTAMP, 'UNIXEPOCH') AS ORIGINAL_AIRDROP_TIMESTAMP,
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		SYSTEM AS TIME_OFFSET,
		AIRDROP_ID AS "PLXPCAGENT_EVENTFORWARD_AIRDROP TABLE ID"
	FROM
		(
		SELECT
			BUNDLEID,
			AIRDROP_ID,
			AIRDROP_TIMESTAMP,
			TIME_OFFSET_TIMESTAMP,
			MAX(TIME_OFFSET_ID) AS MAX_ID,
			SYSTEM,
			PID,
			SUBEVENT,
			STATE
		FROM
			(
		SELECT
			PLXPCAGENT_EVENTFORWARD_AIRDROP.TIMESTAMP AS AIRDROP_TIMESTAMP,
			PLXPCAGENT_EVENTFORWARD_AIRDROP.BUNDLEID,
			PLXPCAGENT_EVENTFORWARD_AIRDROP.PID,
			PLXPCAGENT_EVENTFORWARD_AIRDROP.SUBEVENT,
			PLXPCAGENT_EVENTFORWARD_AIRDROP.STATE,
			PLXPCAGENT_EVENTFORWARD_AIRDROP.ID AS "AIRDROP_ID",
			PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
			PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.ID AS TIME_OFFSET_ID,
			PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.SYSTEM,
			BUNDLEID 
		FROM
			PLXPCAGENT_EVENTFORWARD_AIRDROP 
		LEFT JOIN
			PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET 
			)
		AS AIRDROPSTATE 
		GROUP BY
			AIRDROP_ID 
		)
'''
[variant.requires]
tables = []

# Converted from legacy APOLLO module "powerlog_app_audio.txt"

id = "powerlog_app_audio"
name = "powerlog_app_audio"
activity = "App Audio Routing"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Audio Routing via App"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_14"
sql = '''
SELECT
        DATETIME(TIMESTAMP, 'UNIXEPOCH') AS TIMESTAMP,
        DATETIME(TIMESTAMPLOGGED, 'UNIXEPOCH') AS "TIMESTAMP LOGGED",
        OPERATION,
        APPLICATIONNAME AS "APPLICATION NAME / BUNDLE ID",
        ASSERTIONNAME AS "ASSERTION NAME",
        AUDIOROUTE AS "AUDIO ROUTE",
        MIRRORINGSTATE AS "MIRRORING STATE",
        ASSERTIONID AS "ASERTION ID",
        PID,
        ID AS "PLAUDIOAGENT_EVENTPOINT_AUDIOAPP TABLE ID" 
    FROM
        PLAUDIOAGENT_EVENTPOINT_AUDIOAPP
'''
[variant.requires]
tables = []

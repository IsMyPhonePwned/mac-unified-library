id = "powerlog_app_deletion"
name = "powerlog_app_deletion"
activity = "App Deletion"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Applications that have been recently deleted."
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "app_deleted_date"
epoch = "iso_text"

[[variant]]
label = "legacy-11_12_13_14"
sql = '''
SELECT
		DATETIME(APPDELETEDDATE, 'UNIXEPOCH') AS "APP DELETED DATE",
		DATETIME(TIMESTAMP, 'UNIXEPOCH') AS TIMESTAMP,
		APPNAME AS "APP NAME",
		APPEXECUTABLE AS "APP EXECUTABLE NAME",
		APPBUNDLEID AS "BUNDLE ID",
		APPBUILDVERSION AS "APP BUILD VERSION",
		APPBUNDLEVERSION AS "APP BUNDLE VERSION",
		APPTYPE AS "APP TYPE",
		ID AS "PLAPPLICATIONAGENT_EVENTNONE_ALLAPPS TABLE ID" 
	FROM
		PLAPPLICATIONAGENT_EVENTNONE_ALLAPPS 
	WHERE
		APPDELETEDDATE > 0
'''
[variant.requires]
tables = []


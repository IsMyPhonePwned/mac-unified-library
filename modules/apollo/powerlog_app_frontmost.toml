# Converted from legacy APOLLO module "powerlog_app_frontmost.txt"

id = "powerlog_app_frontmost"
name = "powerlog_app_frontmost"
activity = "Frontmost App"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Frontmost Application"
platforms = ["macos"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-10.15_10.16"
sql = '''
SELECT
		DATETIME(TIMESTAMP + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		BUNDLEID AS 'BUNDLE ID',
		ASN AS 'ASN',
		APPLICATIONTYPE AS 'APPLICATION TYPE',
		DATETIME(TIMESTAMP, 'UNIXEPOCH') AS ORIGINAL_TIMESTAMP,
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		SYSTEM AS TIME_OFFSET,
		TABLE_ID AS "PLAPPLICATIONAGENT_EVENTFORWARD_FRONTMOSTAPP TABLE ID"
	FROM
	(
	SELECT
		TABLE_ID,
		TIMESTAMP,
		TIME_OFFSET_TIMESTAMP,
		MAX(TIME_OFFSET_ID) AS MAX_ID,
		BUNDLEID,
		ASN,
		APPLICATIONTYPE,
		SYSTEM
	FROM
	(
	SELECT
		PLAPPLICATIONAGENT_EVENTFORWARD_FRONTMOSTAPP.TIMESTAMP,
		PLAPPLICATIONAGENT_EVENTFORWARD_FRONTMOSTAPP.BUNDLEID,
		PLAPPLICATIONAGENT_EVENTFORWARD_FRONTMOSTAPP.ASN,
		PLAPPLICATIONAGENT_EVENTFORWARD_FRONTMOSTAPP.APPLICATIONTYPE,
		PLAPPLICATIONAGENT_EVENTFORWARD_FRONTMOSTAPP.ID AS "TABLE_ID",
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.ID AS TIME_OFFSET_ID,
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.SYSTEM
	FROM
		PLAPPLICATIONAGENT_EVENTFORWARD_FRONTMOSTAPP 
	LEFT JOIN
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET 
	)
	GROUP BY
	TABLE_ID 
         )
'''
[variant.requires]
tables = []

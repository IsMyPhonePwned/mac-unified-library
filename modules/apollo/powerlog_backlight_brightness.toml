# Converted from legacy APOLLO module "powerlog_backlight_brightness.txt"

id = "powerlog_backlight_brightness"
name = "powerlog_backlight_brightness"
activity = "Blacklight Brightness"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Display Brightness"
platforms = ["macos", "ios"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-10.15_10.16_13_14"
sql = '''
SELECT
		DATETIME(TIMESTAMP + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		LINEARBRIGHTNESS AS 'LINEAR BRIGHTNESS',
		DATETIME(TIMESTAMP, 'UNIXEPOCH') AS ORIGINAL_TIMESTAMP,
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		SYSTEM AS TIME_OFFSET,
		TABLE_ID AS "PLXPCAGENT_EVENTFORWARD_APPLEBACKLIGHTBRIGHTNESS TABLE ID"
	FROM
	(
	SELECT
		TABLE_ID,
		TIMESTAMP,
		TIME_OFFSET_TIMESTAMP,
		MAX(TIME_OFFSET_ID) AS MAX_ID,
		TIMESTAMP,
		LINEARBRIGHTNESS,
		SYSTEM
	FROM
	(
	SELECT
		PLXPCAGENT_EVENTFORWARD_APPLEBACKLIGHTBRIGHTNESS.TIMESTAMP,
		PLXPCAGENT_EVENTFORWARD_APPLEBACKLIGHTBRIGHTNESS.LINEARBRIGHTNESS,
		PLXPCAGENT_EVENTFORWARD_APPLEBACKLIGHTBRIGHTNESS.ID AS "TABLE_ID",
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.ID AS TIME_OFFSET_ID,
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.SYSTEM
	FROM
		PLXPCAGENT_EVENTFORWARD_APPLEBACKLIGHTBRIGHTNESS 
	LEFT JOIN
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET 
	)
	GROUP BY
	TABLE_ID 
         )
'''
[variant.requires]
tables = []

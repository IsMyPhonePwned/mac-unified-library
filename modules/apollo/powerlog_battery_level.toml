# Converted from legacy APOLLO module "powerlog_battery_level.txt"

id = "powerlog_battery_level"
name = "powerlog_battery_level"
activity = "Battery Level"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Battery Level"
platforms = ["ios", "macos"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_10.13_10.14_10.15_10.16_14"
sql = '''
SELECT
		DATETIME(TIMESTAMP + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		LEVEL AS 'LEVEL',
		RAWLEVEL AS 'RAW LEVEL',
		ISCHARGING AS 'IS CHARGING',
		FULLYCHARGED AS 'FULLY CHARGED',
		DATETIME(TIMESTAMP, 'UNIXEPOCH') AS ORIGINAL_TIMESTAMP,
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		SYSTEM AS TIME_OFFSET,
		TABLE_ID AS "PLBATTERYAGENT_EVENTBACKWARD_BATTERY TABLE ID"
	FROM
	(
	SELECT
		TABLE_ID,
		TIMESTAMP,
		TIME_OFFSET_TIMESTAMP,
		MAX(TIME_OFFSET_ID) AS MAX_ID,
		LEVEL,
		RAWLEVEL,
		ISCHARGING,
		FULLYCHARGED,
		SYSTEM
	FROM
	(
	SELECT
		PLBATTERYAGENT_EVENTBACKWARD_BATTERY.TIMESTAMP,
		PLBATTERYAGENT_EVENTBACKWARD_BATTERY.LEVEL,
		PLBATTERYAGENT_EVENTBACKWARD_BATTERY.RAWLEVEL,
		PLBATTERYAGENT_EVENTBACKWARD_BATTERY.ISCHARGING,
		PLBATTERYAGENT_EVENTBACKWARD_BATTERY.FULLYCHARGED,
		PLBATTERYAGENT_EVENTBACKWARD_BATTERY.ID AS "TABLE_ID",
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.ID AS TIME_OFFSET_ID,
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.SYSTEM
	FROM
		PLBATTERYAGENT_EVENTBACKWARD_BATTERY 
	LEFT JOIN
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET 
	)
	GROUP BY
	TABLE_ID 
         )
'''
[variant.requires]
tables = []

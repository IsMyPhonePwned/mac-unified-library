# Converted from legacy APOLLO module "powerlog_bluetooth_device_state.txt"

id = "powerlog_bluetooth_device_state"
name = "powerlog_bluetooth_device_state"
activity = "Bluetooth State"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Keeps track of Bluetooth state on device, discoverability, connection, etc."
platforms = ["ios", "macos"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_10.15_10.16_14"
sql = '''
SELECT
		DATETIME(BLUETOOTHSTATE_TIMESTAMP + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		CASE DEVICECONNECTABLE 
			WHEN "0" THEN "NO" 
			WHEN "1" THEN "YES" 
		END AS "DEVICE CONNECTABLE",
		CASE DEVICECONNECTED 
			WHEN "0" THEN "NO" 
			WHEN "1" THEN "YES" 
		END AS "DEVICE CONNECTED",
		CASE DEVICEDISCOVERABLE 
			WHEN "0" THEN "NO" 
			WHEN "1" THEN "YES" 
		END AS "DEVICE DISCOVERABLE",
		CASE DEVICEPOWERED 
			WHEN "0" THEN "NO" 
			WHEN "1" THEN "YES" 
		END AS "DEVICE POWERED",
		DATETIME(BLUETOOTHSTATE_TIMESTAMP, 'UNIXEPOCH') AS ORIGINAL_BLUETOOTHSTATE_TIMESTAMP,
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		SYSTEM AS TIME_OFFSET,
		BLUETOOTHSTATE_ID AS "PLBLUETOOTHAGENT_EVENTFORWARD_DEVICESTATE TABLE ID" 
   	FROM
      (
		SELECT
			BLUETOOTHSTATE_ID,
			BLUETOOTHSTATE_TIMESTAMP,
			TIME_OFFSET_TIMESTAMP,
			MAX(TIME_OFFSET_ID) AS MAX_ID,
			DEVICECONNECTABLE,
			DEVICECONNECTED,
			DEVICEDISCOVERABLE,
			DEVICEPOWERED,
			SYSTEM
		FROM
            (
			SELECT
				PLBLUETOOTHAGENT_EVENTFORWARD_DEVICESTATE.TIMESTAMP AS BLUETOOTHSTATE_TIMESTAMP,
				DEVICECONNECTABLE,
				DEVICECONNECTED,
				DEVICEDISCOVERABLE,
				DEVICEPOWERED,
				PLBLUETOOTHAGENT_EVENTFORWARD_DEVICESTATE.ID AS "BLUETOOTHSTATE_ID" ,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.ID AS TIME_OFFSET_ID,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.SYSTEM
			FROM
				PLBLUETOOTHAGENT_EVENTFORWARD_DEVICESTATE
			LEFT JOIN
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET  
            )
            AS BLUETOOTHSTATE_STATE 
        GROUP BY
			BLUETOOTHSTATE_ID 
      )
'''
[variant.requires]
tables = []

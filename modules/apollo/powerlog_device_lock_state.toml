# Converted from legacy APOLLO module "powerlog_device_lock_state.txt"

id = "powerlog_device_lock_state"
name = "powerlog_device_lock_state"
activity = "Lock State"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Records when the device is locked or unlocked."
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_14_15_16_17_18_19"
sql = '''
SELECT
		DATETIME(LOCKSTATE_TIMESTAMP + COALESCE(SYSTEM, 0), 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		CASE CAST(LOCKED AS INTEGER)
			WHEN 0 THEN 'DEVICE UNLOCKED'
			WHEN 1 THEN 'DEVICE LOCKED'
			ELSE 'DEVICE LOCK UNKNOWN'
		END AS "LOCK STATUS",
		DATETIME(LOCKSTATE_TIMESTAMP, 'UNIXEPOCH') AS ORIGINAL_LOCKSTATE_TIMESTAMP,
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		COALESCE(SYSTEM, 0) AS TIME_OFFSET,
		LOCKSTATE_ID AS "PLSPRINGBOARDAGENT_EVENTFORWARD_SBLOCK TABLE ID"
	FROM
	(
		SELECT
			LOCKSTATE_ID,
			LOCKSTATE_TIMESTAMP,
			TIME_OFFSET_TIMESTAMP,
			MAX(TIME_OFFSET_ID) AS MAX_ID,
			LOCKED,
			SYSTEM
		FROM
		(
			SELECT
				SB.TIMESTAMP AS LOCKSTATE_TIMESTAMP,
				SB.LOCKED AS LOCKED,
				SB.ID AS LOCKSTATE_ID,
				TOFF.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
				TOFF.ID AS TIME_OFFSET_ID,
				TOFF.SYSTEM AS SYSTEM
			FROM
				PLSpringBoardAgent_EventForward_SBLock AS SB
			LEFT JOIN
				PLStorageOperator_EventForward_TimeOffset AS TOFF
				ON 1 = 1
		)
		AS LOCKSTATE_STATE
		GROUP BY
			LOCKSTATE_ID
	)
'''
[variant.requires]
tables = []

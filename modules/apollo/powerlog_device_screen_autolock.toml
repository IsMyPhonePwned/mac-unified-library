# Converted from legacy APOLLO module "powerlog_device_screen_autolock.txt"

id = "powerlog_device_screen_autolock"
name = "powerlog_device_screen_autolock"
activity = "Screen Unlock State"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Records the Auto-Lock timestamp."
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_14_15_16_17_18_19"
sql = '''
SELECT
		DATETIME(SBAUTOLOCK_TIMESTAMP + COALESCE(SYSTEM, 0), 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		AUTOLOCKTYPE AS "AUTO LOCK TYPE",
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		COALESCE(SYSTEM, 0) AS TIME_OFFSET,
		SBAUTOLOCK_ID AS "PLSPRINGBOARDAGENT_EVENTPOINT_SBAUTOLOCK TABLE ID"
	FROM
	(
		SELECT
			SBAUTOLOCK_ID,
			SBAUTOLOCK_TIMESTAMP,
			TIME_OFFSET_TIMESTAMP,
			MAX(TIME_OFFSET_ID) AS MAX_ID,
			AUTOLOCKTYPE,
			SYSTEM
		FROM
		(
			SELECT
				AL.TIMESTAMP AS SBAUTOLOCK_TIMESTAMP,
				AL.AUTOLOCKTYPE AS AUTOLOCKTYPE,
				AL.ID AS SBAUTOLOCK_ID,
				TOFF.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
				TOFF.ID AS TIME_OFFSET_ID,
				TOFF.SYSTEM AS SYSTEM
			FROM
				PLSpringBoardAgent_EventPoint_SBAutoLock AS AL
			LEFT JOIN
				PLStorageOperator_EventForward_TimeOffset AS TOFF
				ON 1 = 1
		)
		AS SBAUTOLOCK_STATE
		GROUP BY
			SBAUTOLOCK_ID
	)
'''
[variant.requires]
tables = []

# Converted from legacy APOLLO module "powerlog_display_brightness.txt"

id = "powerlog_display_brightness"
name = "powerlog_display_brightness"
activity = "Screen Brightness"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Screen Brightness Percentage"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_14"
sql = '''
SELECT
		DATETIME(BRIGHTNESS_TIMESTAMP + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		BRIGHTNESS,
		DATETIME(BRIGHTNESS_TIMESTAMP, 'UNIXEPOCH') AS ORIGINAL_BRIGHTNESS_TIMESTAMP,
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		SYSTEM AS TIME_OFFSET,
		BRIGHTNESS_ID AS "PLDISPLAYAGENT_EVENTFORWARD_DISPLAY TABLE ID" 
   	FROM
      (
		SELECT
			BRIGHTNESS_ID,
			BRIGHTNESS_TIMESTAMP,
			TIME_OFFSET_TIMESTAMP,
			MAX(TIME_OFFSET_ID) AS MAX_ID,
			BRIGHTNESS,
			SYSTEM
		FROM
            (
			SELECT
				PLDISPLAYAGENT_EVENTFORWARD_DISPLAY.TIMESTAMP AS BRIGHTNESS_TIMESTAMP,
				BRIGHTNESS,
				PLDISPLAYAGENT_EVENTFORWARD_DISPLAY.ID AS "BRIGHTNESS_ID" ,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.ID AS TIME_OFFSET_ID,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.SYSTEM
			FROM
				PLDISPLAYAGENT_EVENTFORWARD_DISPLAY
			LEFT JOIN
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET 
            )
            AS BRIGHTNESS_STATE 
        GROUP BY
			BRIGHTNESS_ID 
      )
'''
[variant.requires]
tables = []

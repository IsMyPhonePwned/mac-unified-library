# Converted from legacy APOLLO module "powerlog_ids_messages.txt"

id = "powerlog_ids_messages"
name = "powerlog_ids_messages"
activity = "IDS Messages"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "IDS Messages"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_14"
sql = '''
SELECT
	   DATETIME(TIMESTAMP, 'UNIXEPOCH') AS TIMESTAMP,
	   DATETIME(TIMESTAMPEND, 'UNIXEPOCH') AS "TIMESTAMP END",
	   TOPIC AS "TOPIC",
	   PRIORITY AS "PRIORITY",
	   INCOMINGMESSAGES AS "INCOMING MESSAGES",
	   OUTGOINGMESSAGES AS "OUTGOING MESSAGES",
	   INCOMINGBYTES AS "INCOMING BYTES",
	   OUTGOINGBYTES AS "OUTGOING BYTES",
	   ID AS "PLIDENTITYSERVICESAGENT_EVENTINTERVAL_IDSMESSAGEPERIODIC TABLE ID" 
	FROM
	   PLIDENTITYSERVICESAGENT_EVENTINTERVAL_IDSMESSAGEPERIODIC
'''
[variant.requires]
tables = []

id = "powerlog_location_tech_status"
name = "powerlog_location_tech_status"
activity = "Location Technology"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Technology used to determine location."
platforms = ["ios", "macos"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-11_12_13_10.15_10.16_14"
sql = '''
SELECT
		DATETIME(LOCATIONTECH_TIMESTAMP + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		ACCESSORY AS "ACCESSORY",
		CELL AS "CELL",
		GPS AS "GPS",
		GPS_COARSE AS "GPS COARSE",
		LAC AS "LAC",
		MCC AS "MCC",
		NMEA AS "NMEA",
		PIPELINE AS "PIPELINE",
		SKYHOOK AS "SKYHOOK",
		WIFI AS "WIFI",
		WIFI2 AS "WIFI2",
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		SYSTEM AS TIME_OFFSET,
		LOCATIONTECH_ID AS "PLLOCATIONAGENT_EVENTFORWARD_TECHSTATUS TABLE ID" 
   	FROM
      (
		SELECT
			LOCATIONTECH_ID,
			LOCATIONTECH_TIMESTAMP,
			TIME_OFFSET_TIMESTAMP,
			MAX(TIME_OFFSET_ID) AS MAX_ID,
			ACCESSORY,
			CELL,
			GPS,
			GPS_COARSE,
			LAC,
			MCC,
			NMEA,
			PIPELINE,
			SKYHOOK,
			WIFI,
			WIFI2,
			SYSTEM
		FROM
            (
			SELECT
				PLLOCATIONAGENT_EVENTFORWARD_TECHSTATUS.TIMESTAMP AS LOCATIONTECH_TIMESTAMP,
				ACCESSORY,
				CELL,
				GPS,
				GPS_COARSE,
				LAC,
				MCC,
				NMEA,
				PIPELINE,
				SKYHOOK,
				WIFI,
				WIFI2,
				PLLOCATIONAGENT_EVENTFORWARD_TECHSTATUS.ID AS "LOCATIONTECH_ID" ,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.ID AS TIME_OFFSET_ID,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.SYSTEM
			FROM
				PLLOCATIONAGENT_EVENTFORWARD_TECHSTATUS
			LEFT JOIN
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET 
            )
            AS LOCATIONTECH_STATE 
        GROUP BY
			LOCATIONTECH_ID 
      )
'''
[variant.requires]
tables = []


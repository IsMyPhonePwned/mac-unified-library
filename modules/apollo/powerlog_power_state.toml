id = "powerlog_power_state"
name = "powerlog_power_state"
activity = "Power State"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Power State, Sleep/Wake Status"
platforms = ["macos"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-10.16"
sql = '''
SELECT
		DATETIME(TIMESTAMP + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		DATETIME(TIMESTAMPLOGGED + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_LOGGED_TIMESTAMP,
		UUID AS 'UUID',
		REASON AS 'REASON',
		REASONVALUE AS 'REASON VALUE',
		WAKEREASON AS 'WAKE REASON',
		SLEEPTRIGGERS AS 'SLEEP TRIGGERS',
		STATE AS 'STATE',
		EVENT AS 'EVENT',
		DRIVERWAKEREASON,
		CAPABILITIES AS 'CAPABILITIES',
		CURRENTKERNELWAKETIME AS 'CURRENT KERNEL WAKE TIME',
		DATETIME(KERNELSLEEPDATE, 'UNIXEPOCH') AS  'KERNEL SLEEP DATE',
		DATETIME(TIMESTAMP, 'UNIXEPOCH') AS ORIGINAL_TIMESTAMP,
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		SYSTEM AS TIME_OFFSET,
		TABLE_ID AS "PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE TABLE ID"
	FROM
	(
	SELECT
		TABLE_ID,
		TIMESTAMP,
		TIME_OFFSET_TIMESTAMP,
		MAX(TIME_OFFSET_ID) AS MAX_ID,
		TIMESTAMPLOGGED,
		CAPABILITIES,
		CURRENTKERNELWAKETIME,
		EVENT,
		KERNELSLEEPDATE,
		REASON,
		SLEEPTRIGGERS,
		STATE,
		UUID,
		DRIVERWAKEREASON,
		REASONVALUE,
		WAKEREASON,
		SYSTEM
	FROM
	(
	SELECT
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.TIMESTAMP,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.TIMESTAMPLOGGED,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.CAPABILITIES,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.CURRENTKERNELWAKETIME,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.EVENT,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.KERNELSLEEPDATE,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.REASON,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.SLEEPTRIGGERS,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.STATE,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.UUID,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_DRIVERWAKEREASON.VALUE AS DRIVERWAKEREASON,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_REASON.VALUE AS REASONVALUE,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_WAKETYPE.VALUE AS WAKEREASON,
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.ID AS "TABLE_ID",
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.ID AS TIME_OFFSET_ID,
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.SYSTEM
	FROM
		PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE 
		LEFT JOIN PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_REASON ON PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.ID == PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_REASON.FK_ID
		LEFT JOIN PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_WAKETYPE ON PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.ID == PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_WAKETYPE.FK_ID
		LEFT JOIN PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_DRIVERWAKEREASON ON PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE.ID == PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_DRIVERWAKEREASON.FK_ID
	LEFT JOIN
		PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET 
	)
	GROUP BY
	TABLE_ID 
         )
'''
[variant.requires]
tables = ["PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_REASON", "PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_WAKETYPE", "PLSLEEPWAKEAGENT_EVENTFORWARD_POWERSTATE_ARRAY_DRIVERWAKEREASON"]


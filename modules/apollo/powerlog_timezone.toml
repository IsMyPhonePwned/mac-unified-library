# Converted from legacy APOLLO module "powerlog_timezone.txt"

id = "powerlog_timezone"
name = "powerlog_timezone"
activity = "Timezone"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Keeping track of the timezone."
platforms = ["ios", "macos"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_10.14_10.15_10.16_14"
sql = '''
SELECT
		DATETIME(TIMEZONE_TIMESTAMP + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
		TIMEZONENAME AS "TIME ZONE NAME",
		COUNTRYCODE AS "COUNTRY CODE",
		LOCALEID AS "LOCALE ID",
		SECONDSFROMGMT / 3600 AS "SECONDS FROM GMT",
		TIMEZONEISINDST AS "TIME ZONE IN DST",
		TRIGGER AS "TRIGGER",
		DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
		SYSTEM AS TIME_OFFSET,
		TIMEZONE_ID AS "PLLOCALEAGENT_EVENTFORWARD_TIMEZONE TABLE ID" 
   	FROM
      (
		SELECT
			TIMEZONE_ID,
			TIMEZONE_TIMESTAMP,
			TIME_OFFSET_TIMESTAMP,
			MAX(TIME_OFFSET_ID) AS MAX_ID,
			TIMEZONENAME,
			COUNTRYCODE,
			LOCALEID,
			SECONDSFROMGMT,
			TIMEZONEISINDST,
			TRIGGER,
			SYSTEM
		FROM
            (
			SELECT
				PLLOCALEAGENT_EVENTFORWARD_TIMEZONE.TIMESTAMP AS TIMEZONE_TIMESTAMP,
				TIMEZONENAME,
				COUNTRYCODE,
				LOCALEID,
				SECONDSFROMGMT,
				TIMEZONEISINDST,
				TRIGGER,
				PLLOCALEAGENT_EVENTFORWARD_TIMEZONE.ID AS "TIMEZONE_ID" ,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.ID AS TIME_OFFSET_ID,
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.SYSTEM
			FROM
				PLLOCALEAGENT_EVENTFORWARD_TIMEZONE
			LEFT JOIN
				PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET
            )
            AS TIMEZONE_STATE 
        GROUP BY
			TIMEZONE_ID 
      )
'''
[variant.requires]
tables = ["GMT"]

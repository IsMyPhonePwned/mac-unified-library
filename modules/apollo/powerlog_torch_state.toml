# Converted from legacy APOLLO module "powerlog_torch_state.txt"

id = "powerlog_torch_state"
name = "powerlog_torch_state"
activity = "Torch/Flashlight State"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Determine when the flashlight/torch wAS turned on/off and how (com.apple.springboard in the Bundle ID is using the control center)."
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["CurrentPowerlog.PLSQL"]
path_globs = ["**/CurrentPowerlog.PLSQL", "**/CurrentPowerlog.PLSQL-wal", "**/Archives/CurrentPowerlog.PLSQL.gz", "**/Archives/CurrentPowerlog.PLSQL"]

[timestamp]
column = "adjusted_timestamp"
epoch = "iso_text"

[[variant]]
label = "legacy-9_10_11_12_13_14"
sql = '''
SELECT
      DATETIME(TORCH_TIMESTAMP + SYSTEM, 'UNIXEPOCH') AS ADJUSTED_TIMESTAMP,
      BUNDLEID AS BUNDLE_ID,
      CASE LEVEL
      WHEN "0" THEN "OFF"
      WHEN "1" THEN "ON"
      END AS STATUS,
      DATETIME(TORCH_TIMESTAMP, 'UNIXEPOCH') AS ORIGINAL_TORCH_TIMESTAMP,
      DATETIME(TIME_OFFSET_TIMESTAMP, 'UNIXEPOCH') AS OFFSET_TIMESTAMP,
      SYSTEM AS TIME_OFFSET,
   TORCH_ID
   FROM
      (
      SELECT
         BUNDLEID,
         TORCH_ID,
         TORCH_TIMESTAMP,
         TIME_OFFSET_TIMESTAMP,
         MAX(TIME_OFFSET_ID) AS MAX_ID,
         SYSTEM,
         LEVEL
      FROM
            (
            SELECT
               PLCAMERAAGENT_EVENTFORWARD_TORCH.TIMESTAMP AS TORCH_TIMESTAMP,
               PLCAMERAAGENT_EVENTFORWARD_TORCH.BUNDLEID,
               PLCAMERAAGENT_EVENTFORWARD_TORCH.LEVEL,
               PLCAMERAAGENT_EVENTFORWARD_TORCH.ID AS "TORCH_ID",
               PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.TIMESTAMP AS TIME_OFFSET_TIMESTAMP,
               PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.ID AS TIME_OFFSET_ID,
               PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET.SYSTEM,
               BUNDLEID 
            FROM
               PLCAMERAAGENT_EVENTFORWARD_TORCH 
            LEFT JOIN
               PLSTORAGEOPERATOR_EVENTFORWARD_TIMEOFFSET 
            ) 
            AS TORCHESTATE 
      GROUP BY
         TORCH_ID 
      )
'''
[variant.requires]
tables = []

# Converted from legacy APOLLO module "routined_local_vehicle_parked_history.txt"

id = "routined_local_vehicle_parked_history"
name = "routined_local_vehicle_parked_history"
activity = "Routined Location - Vehicle Park History"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "Parked Vehicle - Historical Locations"
platforms = ["ios"]

[source]
kind = "sqlite"
db_names = ["Local.sqlite"]
path_globs = ["**/Local.sqlite", "**/Local.sqlite-wal", "**/Archives/Local.sqlite.gz", "**/Archives/Local.sqlite"]

[timestamp]
column = "date"
epoch = "iso_text"

[[variant]]
label = "legacy-11_12_13_14"
sql = '''
SELECT
	   DATETIME(ZRTVEHICLEEVENTHISTORYMO.ZDATE + 978307200, 'UNIXEPOCH') AS "DATE",
	   DATETIME(ZRTVEHICLEEVENTHISTORYMO.ZLOCDATE + 978307200, 'UNIXEPOCH') AS "LOCATION DATE",
	   ZLOCLATITUDE || ", " || ZLOCLONGITUDE AS "COORDINATES",
	   ZLOCUNCERTAINTY AS "LOCATION UNCERTAINTY",
	   ZIDENTIFIER AS "IDENTIFIER",
	   ZLOCLATITUDE AS "LATITUDE",
	   ZLOCLONGITUDE AS "LONGITUDE",
	   ZRTVEHICLEEVENTHISTORYMO.Z_PK AS "ZRTLEARNEDVISITMO TABLE ID" 
	FROM
	   ZRTVEHICLEEVENTHISTORYMO
'''
[variant.requires]
tables = []

activity = "System Policy Configuration - Exec Measurements"
author = "Sarah Edwards/mac4n6.com/@iamevltwin"
notes = "System Policy Configuration - ExecPolicy - Executable Measurements"
platforms = ["macos"]

[source]
kind = "sqlite"
db_names = ["ExecPolicy"]
